<style>
:root{--bg:#eaf0ef;--card:#fff;--ink:#10282a;--mut:#5d7274;--pri:#0f766e;--on:#fff;--amb:#b45309;--ok:#15803d;--line:#d3dfde;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
main{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:20px;font-weight:800;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 0;max-width:980px;margin:0 auto}
nav{display:flex;gap:6px;padding:10px 12px 0;max-width:980px;margin:0 auto;overflow-x:auto}
nav button{flex:1;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

.tb.oc{background:#fdfbd7}.tb.tk{background:#e8f4ea}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $$=n=>(S.set.cur??'$')+(+(+n).toFixed(2));
let S={tables:{},orders:[],sales:[],pays:{},meta:{},menuText:DEF,set:{service:0,tax:0},staff:'Admin:1234:admin\nCashier:0000:cashier',seq:1,ver:2};
try{const r=localStorage.getItem('pos-v1');if(r){const o=JSON.parse(r);if(o.ver!=2)delete o.menuText;S=Object.assign(S,o,{ver:2})}}catch(e){}
let DB=null,lastL='',lastC='',tm;
const live=()=>JSON.stringify({tables:S.tables,orders:S.orders.filter(o=>o.status!='served').slice(-60),pays:S.pays,meta:S.meta,seq:S.seq});
const conf=()=>JSON.stringify({menuText:S.menuText,set:S.set,staff:S.staff});
function save(){try{localStorage.setItem('pos-v1',JSON.stringify(S))}catch(e){}if(!DB)return;clearTimeout(tm);tm=setTimeout(()=>{const l=live(),c=conf();if(l!=lastL){lastL=l;DB.doc('pos/live').set({j:l}).then(()=>{SY.w++;SY.err=''}).catch(sErr)}if(c!=lastC){lastC=c;DB.doc('pos/config').set({j:c}).then(()=>{SY.w++;SY.err=''}).catch(sErr)}},250)}
let ui={tab:'order',table:'',cat:0,view:'home',ocat:1,md:null,rst:false};
const TBL=()=>[...Array(+S.set.tables||12)].map((_,i)=>String(i+1)).concat('سفري');
const NUM=/^(.*?)\s+(\d+(?:\.\d+)?)$/;
function parse(t){const cats=[];let c,d;t.split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]=='+'){const x=l.slice(1).trim().match(NUM);if(d&&x)d.extras.push({name:x[1],price:+x[2]});return}const m=l.match(NUM);if(m){if(!c){c={name:'عام',dishes:[]};cats.push(c)}d={name:m[1],price:+m[2],extras:[]};c.dishes.push(d)}else{c={name:l,dishes:[]};cats.push(c);d=null}});return cats}
let MENU=parse(S.menuText);
const cart=()=>S.tables[ui.table]||[];
const lab=id=>{const m=S.meta[id];return m?(m.label||'Order '+new Date(m.time).toTimeString().slice(0,5)):'طاولة '+id};
const ago=t=>{const m=Math.floor((Date.now()-t)/6e4);return m<1?'منذ أقل من دقيقة':m<60?'منذ '+m+' دقيقة':'منذ '+Math.floor(m/60)+' ساعة'};
const qtyOf=n=>cart().filter(i=>!i.void&&(i.name==n||i.name.startsWith(n+' + '))).reduce((a,i)=>a+i.qty,0);
const sum=items=>{const sub=items.reduce((a,i)=>a+(i.void?0:i.price*i.qty),0),sv=sub*S.set.service/100,tx=(sub+sv)*S.set.tax/100;return{sub,sv,tx,tot:sub+sv+tx}};
function add(d,ex){const name=d.name+ex.map(e=>' + '+e.name).join('');const price=d.price+ex.reduce((a,e)=>a+e.price,0);const l=cart();const f=l.find(i=>i.name==name&&!i.sent&&!i.note);if(f)f.qty++;else l.push({name,price,qty:1,note:'',sent:false});save();render()}
function render(){
$('#ttl').textContent='🍽️ '+(S.set.name||'نقطة بيع المطعم');if(!ui.user&&!staffList().length)ui.user={name:'',role:'admin'};

const adm=ui.user.role=='admin';if(!adm&&(ui.tab=='reports'||ui.tab=='settings'))ui.tab='order';
const nk=0,U=ui.user||{};$('#av').textContent=U.name?U.name[0].toUpperCase():'';$('#av').style.display=U.name?'flex':'none';$('#un').textContent=U.name?'👤 '+U.name:'';
$('#nav').innerHTML=[['order','الطلبات'],['tables','الطاولات'],...(adm?[['reports','التقارير'],['settings','الإعدادات']]:[])].map(t=>`<button data-act="tab" data-v="${t[0]}" class="${ui.tab==t[0]?'on':''}">${t[1]}</button>`).join('')+'<button data-act="logout" style="flex:none">خروج</button>';
const cs0=document.querySelector('main>.chips'),sl0=cs0?cs0.scrollLeft:0;
$('#app').innerHTML={order:vOrder,tables:vTables,reports:vReports,settings:vSettings}[ui.tab]();
const cs1=document.querySelector('main>.chips');if(cs1){cs1.scrollLeft=sl0;const on=cs1.querySelector('.chip.on');if(on)on.scrollIntoView({block:'nearest',inline:'nearest'})}
const mv=ui.tab=='order'&&ui.view=='menu';document.querySelector('.top').style.display=$('#nav').style.display=mv?'none':'';
$('#md').innerHTML=ui.md?vModal():'';}
function vTables(){const n=+S.set.tables||12,occ={};Object.keys(S.tables).forEach(id=>{const m=S.meta[id]||{};if(m.table&&!m.void)occ[m.table]=id});
const tiles=[...Array(n)].map((_,i)=>{const k=String(i+1),id=occ[k],l=id?S.tables[id]:[],t=sum(l);return`<div class="tb ${id&&l.length?'oc':''}" data-act="tbl" data-v="${k}"><b>${k}</b>${id&&l.length?`<span>${$$(t.tot)}</span><small>${ago((S.meta[id]||{}).time||Date.now())}</small>`:'<small>متاحة</small>'}</div>`}).join('');
return`<div class="tg">${tiles}<div class="tb tk" data-act="tbl" data-v="tk"><b>سفري</b><small>طلب جديد</small></div></div>`}
function setDisc(id,t,v){const l=S.tables[id]||[];for(let k=l.length-1;k>=0;k--)if(l[k].disc)l.splice(k,1);const sub=l.reduce((a,i)=>a+(i.void?0:i.price*i.qty),0),amt=t=='%'?Math.round(sub*v)/100:Math.min(v,sub);if(amt>0)l.push({name:t=='%'?'Discount '+v+'%':'Discount',price:-amt,qty:1,note:'',sent:true,disc:1})}
const roomBal=r=>{let b=0;S.sales.forEach(s=>{(s.pays||[]).forEach(x=>{if(x.room==r)b+=x.amount});if(s.settle&&s.room==r)b-=s.total});return Math.round(b*100)/100};
function vOrder(){return ui.view=='menu'?vMenu():vHome()}
function vHome(){const ids=Object.keys(S.tables).filter(id=>S.tables[id].length&&!(S.meta[id]||{}).hide).sort((a,b)=>((S.meta[a]||{}).time||0)-((S.meta[b]||{}).time||0));
const cards=ids.map(id=>{const l=S.tables[id],m=S.meta[id]||{},t=sum(m.void?[]:l),sd=m.void?'text-decoration:line-through;opacity:.6;':'';return`<div class="box" style="margin:0"><div style="display:flex;align-items:center"><b data-act="open" data-v="${id}" style="flex:1;font-size:18px;cursor:pointer;${sd}">${esc(lab(id))}</b><button class="kb" data-act="omenu" data-v="${id}">⋮</button></div><div class="mut note">${ago(m.time||Date.now())}</div><div data-act="open" data-v="${id}" style="cursor:pointer;direction:ltr;margin:6px 0;${sd}">${l.map(i=>`<div>${i.qty} ${esc(i.name)}${i.sent?'':' <span class="tag" style="color:var(--amb)">●</span>'}</div>`).join('')}</div><div class="tot"><span>${esc(m.user||'')}</span><b style="color:var(--ink)">${$$(t.tot)}</b></div>${m.void?'':`<div class="btns"><button class="btn s" data-act="pay" data-v="${id}">الدفع</button></div>`}</div>`}).join('');

function dishRows(){const q=(ui.q||'').toLowerCase(),ds=[];MENU.forEach((c,ci)=>{if(q||ci==ui.ocat-1)c.dishes.forEach((d,di)=>{if(!q||d.name.toLowerCase().includes(q))ds.push([ci,di,d])})});

function vMenu(){const id=ui.table,l=cart(),t=sum(l),un=l.filter(i=>!i.sent).length;let body;

function vKitchen(){
const o=S.orders.filter(o=>o.status!='served').sort((a,b)=>a.time-b.time);
if(!o.length)return'<div class="empty">لا توجد طلبات حالياً في المطبخ</div>';
return'<div class="k">'+o.map(x=>`<div class="box ${x.status}"><div class="row" style="padding-top:0"><b>${esc(x.table)} #${x.id}</b><span class="mut">${new Date(x.time).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</span></div>${x.items.map(i=>`<div class="row" style="direction:ltr"><span>${i.qty} × ${esc(i.name)}${i.note?`<div class="mut note">${esc(i.note)}</div>`:''}</span></div>`).join('')}<div class="btns"><button class="btn ${x.status=='new'?'w':''}" data-act="adv" data-v="${x.id}">${x.status=='new'?'جاهز':'تم التقديم'}</button></div></div>`).join('')+'</div>'}
function vReports(){
const dn={d:1,w:7,m:30}[ui.per||'d'],st=new Date();st.setHours(0,0,0,0);st.setDate(st.getDate()-dn+1);const sl=S.sales.filter(s=>s.time>=st.getTime()&&!s.settle),bd={};
const tot=sl.reduce((a,s)=>a+s.total,0),m={cash:0,card:0,room:0},rms={},p={};
sl.forEach(s=>{(s.pays||[{method:s.method,amount:s.total}]).forEach(x=>{m[x.method]=(m[x.method]||0)+x.amount;if(x.room)rms[x.room]=(rms[x.room]||0)+x.amount});const k=new Date(s.time).toLocaleDateString('en-GB');bd[k]=(bd[k]||0)+s.total;s.items.forEach(i=>p[i.name]=(p[i.name]||0)+i.qty)});
const byu={},vo={},rb={};sl.forEach(s=>{const u=s.user||'-',o=byu[u]||(byu[u]={n:0,t:0,cash:0,card:0,room:0});o.n++;o.t+=s.total;(s.pays||[{method:s.method,amount:s.total}]).forEach(x=>o[x.method]=(o[x.method]||0)+x.amount);(s.voids||[]).forEach(v=>{const q=vo[v.reason||'-']||(vo[v.reason||'-']={n:0,t:0});q.n+=v.qty;q.t+=v.qty*v.price})});
S.sales.forEach(s=>(s.pays||[]).forEach(x=>{if(x.room)rb[x.room]=1}));const rdue=Object.keys(rb).map(r=>[r,roomBal(r)]).filter(x=>x[1]>0.004);
const top=Object.entries(p).sort((a,b)=>b[1]-a[1]).slice(0,8);
const csv='time,table,method,total,items\n'+S.sales.map(s=>[new Date(s.time).toISOString(),s.table,(s.pays||[{method:s.method}]).map(x=>x.method).join('+'),s.total.toFixed(2),'"'+s.items.map(i=>i.qty+'x '+i.name).join('; ').replace(/"/g,'""')+'"'].join(',')).join('\n');
return`<div class="chips">${[['d','اليوم'],['w','7 أيام'],['m','30 يوم']].map(x=>`<button class="chip ${(ui.per||'d')==x[0]?'on':''}" data-act="per" data-v="${x[0]}">${x[1]}</button>`).join('')}</div><div class="stats"><div><b>${$$(tot)}</b>الإيراد</div><div><b>${sl.length}</b>عدد الفواتير</div><div><b>${$$(sl.length?tot/sl.length:0)}</b>متوسط الفاتورة</div></div>
<div class="box"><b>طرق الدفع</b><div class="row"><span>كاش</span><b>${$$(m.cash)}</b></div><div class="row"><span>كارت</span><b>${$$(m.card)}</b></div><div class="row"><span>على الغرفة</span><b>${$$(m.room)}</b></div></div>
${dn>1?`<div class="box"><b>الإيراد اليومي</b>${Object.entries(bd).map(x=>`<div class="row"><span>${x[0]}</span><b>${$$(x[1])}</b></div>`).join('')||'<div class="empty">لا توجد مبيعات</div>'}</div>`:''}${rdue.length?`<div class="box"><b>حسابات الغرف المستحقة</b>${rdue.map(x=>`<div class="row"><span>غرفة ${esc(x[0])}</span><b>${$$(x[1])}</b><button class="btn" style="padding:6px 12px" data-act="rset" data-v="${esc(x[0])}">تسوية</button></div>`).join('')}</div>`:''}<div class="box"><b>حسب الكاشير</b>${Object.entries(byu).map(x=>`<div class="row" style="flex-wrap:wrap"><span>${esc(x[0])} (${x[1].n})</span><b>${$$(x[1].t)}</b><span class="mut note" style="width:100%">كاش ${$$(x[1].cash)} · كارت ${$$(x[1].card)} · غرفة ${$$(x[1].room)}</span></div>`).join('')||'<div class="empty">لا توجد مبيعات</div>'}</div>${Object.keys(vo).length?`<div class="box"><b>الأصناف الملغاة</b>${Object.entries(vo).map(x=>`<div class="row"><span>${esc(x[0])} (${x[1].n})</span><b>${$$(x[1].t)}</b></div>`).join('')}</div>`:''}<div class="box"><b>الأصناف الأكثر مبيعاً</b>${top.length?top.map(t=>`<div class="row"><span style="direction:ltr">${esc(t[0])}</span><b>${t[1]}</b></div>`).join(''):'<div class="empty">لا توجد مبيعات اليوم بعد</div>'}</div>
<div class="box"><b>الفواتير (${sl.length})</b>${sl.slice().sort((a,b)=>b.time-a.time).slice(0,100).map(s=>`<div class="row" data-act="inv" data-v="${s.id}" style="cursor:pointer"><div><div>${esc(s.table)}${s.room?' · غرفة '+esc(s.room):''}</div><div class="mut note">${new Date(s.time).toLocaleString('en-GB')}${s.user?' · '+esc(s.user):''}</div></div><b>${$$(s.total)}</b></div>`).join('')||'<div class="empty">لا توجد فواتير في هذه الفترة</div>'}</div>
<div class="box"><b>تصدير كل المبيعات (CSV)</b><p class="mut" style="margin:4px 0 8px">انسخ النص والصقه في ملف .csv أو في Excel</p><textarea rows="5" readonly style="direction:ltr" onclick="this.select()">${esc(csv)}</textarea></div>`}
